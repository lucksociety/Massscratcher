"use strict";
// ================= multi-state configuration =================
// Each state supplies: display names, data file paths, a game-page URL builder,
// and a live() fetcher returning {fetched, G, P}. Add a state by adding an entry
// (plus its files in data/ and a fetcher in scripts/update-data.mjs).
const STATES = {
  ma: {
    name: "Massachusetts",
    lottery: "MassLottery",
    data: "data/ma.json",
    prev: "data/ma-prev.json",
    sourceUrl: "https://www.masslottery.com/games?lobby=scratch",
    helpline: "1-800-327-5050 (MA Problem Gambling Helpline)",
    gameUrl: ident => "https://www.masslottery.com/games/" + ident,
    live: async (onProgress) => {
      const games = await (await fetch("https://www.masslottery.com/api/v1/games", { mode: "cors" })).json();
      const scratch = games.filter(g => g.gameType === "Scratch");
      const G = scratch.map(g => ({
        id: g.id, ident: g.identifier, name: g.name, price: g.price, odds: g.odds,
        start: g.startDate, top: g.topPrize, topDesc: g.topPrizeDescription || null
      }));
      const P = {};
      let done = 0;
      const queue = [...G];
      await Promise.all(Array.from({ length: 8 }, async () => {
        while (queue.length) {
          const g = queue.shift();
          try {
            const j = await (await fetch("https://www.masslottery.com/api/v1/instant-game-prizes?gameID=" + g.id, { mode: "cors" })).json();
            P[g.id] = {
              odds: j.odds, cost: j.ticketCost,
              tiers: (j.prizeTiers || []).map(t => [t.prizeAmount, t.totalPrizes, t.paidPrizes, t.prizesRemaining, t.type === "TOP" ? 1 : 0])
            };
          } catch (e) { /* skip game */ }
          done++;
          if (onProgress) onProgress(done, G.length);
        }
      }));
      if (Object.keys(P).length < G.length * 0.8) throw new Error("too many failures");
      return { fetched: new Date().toISOString().slice(0, 10), G, P };
    }
  }
  // future: tx, ny, fl, …
};

// ================= metric engine =================
function parseOdds(s) {
  const m = /1 in ([\d,.]+)/.exec(s || "");
  return m ? parseFloat(m[1].replace(/,/g, "")) : null;
}
function computeRows(G, P) {
  const rows = [];
  for (const g of G) {
    const p = P[String(g.id)];
    if (!p) continue;
    const R = parseOdds(p.odds) || parseOdds(g.odds);
    const price = p.cost || g.price;
    const tiers = (p.tiers || []).filter(t => t[0] > 0);
    const tot = tiers.reduce((a, t) => a + t[1], 0);
    if (!tot || !R || !price) continue;
    const N = R * tot;
    const rel = tiers.filter(t => t[1] >= 1000);
    const rt = rel.reduce((a, t) => a + t[1], 0), rc = rel.reduce((a, t) => a + t[2], 0);
    const f = rt ? rc / rt : tiers.reduce((a, t) => a + t[2], 0) / tot;
    const nRem = Math.max(N * (1 - f), N * 0.01);
    const remPrizes = tiers.reduce((a, t) => a + t[3], 0);
    const ev = tiers.reduce((a, t) => a + t[3] * t[0], 0) / nRem / price;
    const evLaunch = tiers.reduce((a, t) => a + t[1] * t[0], 0) / N / price;
    const win = remPrizes ? nRem / remPrizes : Infinity;
    const top = tiers.filter(t => t[4] === 1);
    const topRem = top.reduce((a, t) => a + t[3], 0), topTot = top.reduce((a, t) => a + t[1], 0);
    const jack = topTot && topRem ? (topRem / nRem) / (topTot / N) : 0;
    const maxTier = tiers.reduce((a, t) => Math.max(a, t[0]), 0);
    rows.push({
      id: g.id, ident: g.ident, name: (g.name || "").trim(), price, start: g.start,
      topPrize: g.top != null ? g.top : maxTier, topDesc: g.topDesc,
      pctSold: f * 100, nRem, ev: ev * 100, evLaunch: evLaunch * 100,
      win, topRem, topTot, jack, tiers
    });
  }
  const pct = (vals, v) => vals.reduce((a, x) => a + (x <= v ? 1 : 0), 0) / vals.length;
  const evs = rows.map(r => r.ev), wins = rows.map(r => -r.win), jacks = rows.map(r => r.jack);
  for (const r of rows) {
    r.score = 100 * (0.55 * pct(evs, r.ev) + 0.25 * pct(wins, -r.win) + 0.20 * pct(jacks, r.jack));
    r.lowConf = r.pctSold >= 95;
  }
  return rows;
}

// ================= static copy =================
function renderStaticCopy() {
  $("subLine").textContent = "Every day, " + ST.lottery + " reports how many prizes in each scratch game are claimed vs. still out there. Ticket Hunter turns that into one answer: which tickets give you the best shot right now.";
  $("methodP").textContent = ST.lottery + " publishes, for every scratch game, how many prizes at each level have been claimed and how many remain — but not how many tickets remain. Ticket Hunter estimates tickets sold from the claim rate of the high-count, low-value prize tiers (those prizes are claimed almost immediately, so their claim rate closely tracks sales). From there: Value per $ = dollars of unclaimed prizes per remaining ticket, divided by ticket price. Win chance = remaining winning tickets vs. estimated remaining tickets. Jackpot hunt = how loaded the game still is with top prizes relative to launch (1× = as designed). Best overall blends the three (55% value, 25% win chance, 20% jackpot). Games marked ◮ nearly sold out are ≥95% sold — their estimates swing wildly and a big remaining prize may be genuinely great or already gone from shelves. Estimates also lag reality slightly because large prizes take longer to be claimed than small ones.";
  const h = $("honestyP"); h.textContent = "";
  h.append(
    document.createTextNode("Luck Society Ticket Hunter is a statistics tool, not a promise — every ticket is still a gamble, and on average these games keep 15–30¢ of each dollar. Play for fun, never for income. Data: "),

// ================= rendering =================
function filtered() {
  let rows = state.rows;
  if (state.price !== "all") rows = rows.filter(r => r.price === state.price);
  if (state.search) {
    const q = state.search.toLowerCase();
    rows = rows.filter(r => r.name.toLowerCase().includes(q));
  }
  return rows;
}
function sorted(rows) {
  const key = state.sortKey;
  const v = VIEWS[state.view];
  const get = key ? r => r[key] : v.metric;
  return [...rows].sort((a, b) => {
    const x = get(a), y = get(b);
    return (x < y ? -1 : x > y ? 1 : 0) * state.sortDir;
  });
}
function strong(s){ const b=document.createElement("b"); b.textContent=s; return b; }
function txt(s){ return document.createTextNode(s); }
function icTxt(ic, s){ const f=document.createDocumentFragment(); const i=document.createElement("span"); i.className="ic"; i.textContent=ic; f.append(i, document.createTextNode(s)); return f; }
function niceDate(iso) {
  const d = new Date(iso + "T12:00:00");
  return isNaN(d) ? iso : d.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
}

function renderHero(rows) {
  const v = VIEWS[state.view];
  $("heroTitle").textContent = "Today’s best bets in " + ST.name + " · " + niceDate(state.asOf);
  const priceTxt = state.price === "all" ? "at any price" : "for a $" + state.price + " ticket";
  $("heroSub").textContent = "Ranked by " + v.label.toLowerCase() + " " + priceTxt + ". These games currently have the most unclaimed prize money relative to tickets left.";
  const grid = $("heroGrid"); grid.textContent = "";
  const top3 = [...rows].sort((a, b) => v.metric(b) - v.metric(a)).slice(0, 3);
  top3.forEach((r, i) => {
    const d = document.createElement("div"); d.className = "hcard" + (i === 0 ? " first" : "");
    const rk = document.createElement("div"); rk.className = "hrank"; rk.textContent = "#" + (i + 1);
    const pr = document.createElement("div"); pr.className = "hprice"; pr.textContent = "$" + r.price + " ticket";
    const nm = document.createElement("div"); nm.className = "hname";
    const a = document.createElement("a"); a.href = ST.gameUrl(r.ident);
    a.target = "_blank"; a.rel = "noopener"; a.textContent = r.name; nm.appendChild(a);
    d.append(rk, pr, nm);
    const stats = [
      ["Wins right now", "1 in " + r.win.toFixed(2)],
      ["Pays back", r.ev.toFixed(0) + "¢ per $1"],
      ["Top prizes left", r.topRem + " of " + r.topTot + " · " + fmtMoney(r.topPrize)]
    ];
    const hs = v.heroStat(r);
    if (!stats.some(s => s[0] === hs[0])) stats.unshift(hs);
    for (const [l, val] of stats) {
      const s = document.createElement("div"); s.className = "hstat";
      const sl = document.createElement("span"); sl.textContent = l;
      s.append(sl, strong(val)); d.appendChild(s);
    }
    if (r.lowConf) {
      const w = document.createElement("div"); w.className = "conf"; w.style.marginTop = "6px";
      w.append(icTxt("◮ ", "nearly sold out — estimate uncertain"));
      d.appendChild(w);
    }
    grid.appendChild(d);
  });
  if (!top3.length) grid.textContent = "No games match the current filters.";
}

function renderChart(rows) {
  const v = VIEWS[state.view];
  $("chartTitle").textContent = v.chart;
  const top = [...rows].sort((a, b) => v.metric(b) - v.metric(a)).slice(0, 12);
  const holder = $("chart"); holder.textContent = "";
  if (!top.length) { holder.textContent = "No games match the current filters."; return; }
  const value = r => state.view === "win" ? (100 / r.win) : (state.view === "score" ? r.score : (state.view === "ev" ? r.ev : r.jack));
  const maxV = Math.max(...top.map(value));
  const narrow = (holder.clientWidth || 1100) < 640;
  const W = Math.min(1100, holder.clientWidth || 1100), rowH = 30, padL = narrow ? 150 : 235, padR = narrow ? 62 : 78, padT = 6;
  const H = padT + top.length * rowH + 24;
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("width", "100%");
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", v.chart + " (full data in the table below)");
  const plotW = W - padL - padR;
  const tickN = 4;
  for (let i = 1; i <= tickN; i++) {
    const x = padL + plotW * i / tickN;
    const ln = document.createElementNS(ns, "line");
    ln.setAttribute("x1", x); ln.setAttribute("x2", x);
    ln.setAttribute("y1", padT); ln.setAttribute("y2", padT + top.length * rowH);
    ln.setAttribute("stroke", "var(--grid)"); ln.setAttribute("stroke-width", "1");
    svg.appendChild(ln);
    const tx = document.createElementNS(ns, "text");
    tx.setAttribute("x", x); tx.setAttribute("y", padT + top.length * rowH + 16);
    tx.setAttribute("text-anchor", "middle"); tx.setAttribute("fill", "var(--text-muted)"); tx.setAttribute("font-size", "11");
    const tv = maxV * i / tickN;
    tx.textContent = state.view === "win" ? tv.toFixed(0) + "%" : (state.view === "jack" ? tv.toFixed(1) + "×" : tv.toFixed(0));
    svg.appendChild(tx);
  }
  const bl = document.createElementNS(ns, "line");
  bl.setAttribute("x1", padL); bl.setAttribute("x2", padL);
  bl.setAttribute("y1", padT); bl.setAttribute("y2", padT + top.length * rowH);
  bl.setAttribute("stroke", "var(--baseline)"); bl.setAttribute("stroke-width", "1");
  svg.appendChild(bl);
  top.forEach((r, i) => {
    const y = padT + i * rowH + (rowH - 18) / 2;
    const w = Math.max(2, plotW * value(r) / maxV);
    const lbl = document.createElementNS(ns, "text");
    lbl.setAttribute("x", padL - 10); lbl.setAttribute("y", y + 13);
    lbl.setAttribute("text-anchor", "end"); lbl.setAttribute("fill", "var(--text-primary)"); lbl.setAttribute("font-size", "12");
    const maxCh = narrow ? 14 : 24;
    const nm = (r.name.length > maxCh ? r.name.slice(0, maxCh - 1) + "…" : r.name);
    lbl.textContent = "$" + r.price + " · " + nm;
    svg.appendChild(lbl);
    const bar = document.createElementNS(ns, "path");
    const rr = 4, x0 = padL, x1 = padL + w;
    bar.setAttribute("d", `M${x0},${y} L${x1 - rr},${y} Q${x1},${y} ${x1},${y + rr} L${x1},${y + 18 - rr} Q${x1},${y + 18} ${x1 - rr},${y + 18} L${x0},${y + 18} Z`);
    bar.setAttribute("fill", "var(--series-1)");
    svg.appendChild(bar);
    const val = document.createElementNS(ns, "text");
    val.setAttribute("x", x1 + 8); val.setAttribute("y", y + 13);
    val.setAttribute("fill", "var(--text-secondary)"); val.setAttribute("font-size", "12");
    val.textContent = v.fmt(r);
    svg.appendChild(val);
    const hit = document.createElementNS(ns, "rect");
    hit.setAttribute("x", 0); hit.setAttribute("y", padT + i * rowH);
    hit.setAttribute("width", W); hit.setAttribute("height", rowH);
    hit.setAttribute("fill", "transparent");
    hit.setAttribute("tabindex", "0");
    hit.addEventListener("pointermove", e => showTip(e.clientX, e.clientY, r));
    hit.addEventListener("pointerleave", hideTip);
    hit.addEventListener("focus", () => { const b = hit.getBoundingClientRect(); showTip(b.right - 120, b.top, r); });
    hit.addEventListener("blur", hideTip);
    hit.addEventListener("pointerenter", () => bar.setAttribute("opacity", "0.82"));
    hit.addEventListener("pointerout", () => bar.setAttribute("opacity", "1"));
    svg.appendChild(hit);
  });
  holder.appendChild(svg);
}

function showTip(x, y, r) {
  const tip = $("tip"); tip.textContent = "";
  const tv = document.createElement("div"); tv.className = "tv"; tv.textContent = r.name;
  const rows = [
    ["Score", r.score.toFixed(0) + " / 100"],
    ["Payback now", r.ev.toFixed(1) + "¢ per $1 (design: " + r.evLaunch.toFixed(1) + "¢)"],
    ["Win odds now", "1 in " + r.win.toFixed(2)],
    ["Top prizes left", r.topRem + " of " + r.topTot + " · " + fmtMoney(r.topPrize)],
    ["Sold (est.)", r.pctSold.toFixed(1) + "%"]
  ];
  tip.appendChild(tv);
  for (const [l, val] of rows) {
    const d = document.createElement("div");
    const s = document.createElement("span"); s.className = "tl"; s.textContent = l + ": ";
    d.append(s, document.createTextNode(val)); tip.appendChild(d);
  }
  tip.style.display = "block";
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  tip.style.left = Math.min(x + 14, innerWidth - tw - 10) + "px";
  tip.style.top = Math.min(y + 14, innerHeight - th - 10) + "px";
}
function hideTip() { $("tip").style.display = "none"; }

const COLS = [
  { key: null, lab: "#", cls: "" },
  { key: "name", lab: "Game", cls: "l" },
  { key: "ev", lab: "Payback / $1", cls: "" },
  { key: "win", lab: "Win odds", cls: "" },
  { key: "topRem", lab: "Top prizes", cls: "hidesm" },
  { key: "jack", lab: "Jackpot load", cls: "hidesm" },
  { key: "pctSold", lab: "Sold", cls: "hidesm" },
  { key: "score", lab: "Score", cls: "" }
];
function renderTableHead() {
  const tr = $("thead"); tr.textContent = "";
  for (const c of COLS) {
    const th = document.createElement("th");
    th.className = c.cls + (c.key === "name" ? " l" : "");
    th.textContent = c.lab;
    if (c.key) {
      if (state.sortKey === c.key) {
        const s = document.createElement("span"); s.className = "arr";
        s.textContent = state.sortDir === 1 ? " ▲" : " ▼"; th.appendChild(s);
      }
      th.addEventListener("click", () => {
        if (state.sortKey === c.key) state.sortDir *= -1;
        else { state.sortKey = c.key; state.sortDir = (c.key === "win" || c.key === "pctSold" || c.key === "name") ? 1 : -1; }
        render();
      });
    }
    tr.appendChild(th);
  }
}
function renderTable(rows) {
  renderTableHead();
  const tb = $("tbody"); tb.textContent = "";
  const maxEv = Math.max(...state.rows.map(r => Math.min(r.ev, 120)));
  rows.forEach((r, i) => {
    const tr = document.createElement("tr"); tr.className = "g";
    tr.setAttribute("tabindex", "0");
    const td0 = document.createElement("td"); td0.textContent = i + 1; td0.style.color = "var(--text-muted)";
    const td1 = document.createElement("td"); td1.className = "l";
    const tag = document.createElement("span"); tag.className = "pricetag"; tag.textContent = "$" + r.price;
    const nm = document.createElement("span"); nm.className = "gname";
    const a = document.createElement("a"); a.href = ST.gameUrl(r.ident);
    a.target = "_blank"; a.rel = "noopener"; a.textContent = r.name;
    a.addEventListener("click", e => e.stopPropagation());
    nm.appendChild(a);
    if (state.prev && !state.prev.has(r.id)) {
      const nt = document.createElement("span"); nt.className = "newtag"; nt.textContent = "NEW";
      nm.appendChild(nt);
    }
    const meta = document.createElement("div"); meta.className = "gmeta";
    meta.textContent = "top " + fmtMoney(r.topPrize) + (r.topDesc ? " " + r.topDesc.toLowerCase() : "") + " · launched " + (r.start || "—");
    const wrap = document.createElement("div");
    wrap.style.display = "flex"; wrap.style.alignItems = "center";
    const tdiv = document.createElement("div");
    tdiv.append(nm, meta);
    wrap.append(tag, tdiv); td1.appendChild(wrap);
    if (r.lowConf) {
      const w = document.createElement("div"); w.className = "conf";
      w.style.marginLeft = "43px";
      w.append(icTxt("◮ ", "nearly sold out — estimate uncertain"));
      td1.appendChild(w);
    }
    const td2 = document.createElement("td");
    const evw = document.createElement("div"); evw.className = "evcell";
    const evn = document.createElement("span");
    evn.textContent = r.ev.toFixed(1) + "¢";
    const dd = document.createElement("span");
    const diff = r.ev - r.evLaunch;
    dd.className = diff >= 1 ? "delta-up" : "delta-dn";
    dd.textContent = (diff >= 0 ? "+" : "") + diff.toFixed(0) + " vs design";
    const mb = document.createElement("div"); mb.className = "minibar";
    const fi = document.createElement("i"); fi.style.width = Math.min(100, r.ev / maxEv * 100) + "%";
    mb.appendChild(fi);
    evw.append(dd, evn, mb); td2.appendChild(evw);
    const td3 = document.createElement("td"); td3.textContent = "1 in " + r.win.toFixed(2);
    const td4 = document.createElement("td"); td4.className = "hidesm";
    td4.textContent = r.topRem + " / " + r.topTot;
    if (r.topRem === 0) { td4.textContent += " · gone"; td4.style.color = "var(--text-muted)"; }
    const td5 = document.createElement("td"); td5.className = "hidesm";
    td5.textContent = r.jack ? r.jack.toFixed(2) + "×" : "—";
    const td6 = document.createElement("td"); td6.className = "hidesm";
    td6.textContent = r.pctSold.toFixed(0) + "%";
    const sb = document.createElement("span"); sb.className = "soldbar";
    const si = document.createElement("i"); si.style.width = Math.min(100, r.pctSold) + "%";
    sb.appendChild(si); td6.appendChild(sb);
    const td7 = document.createElement("td");
    const sp = document.createElement("span"); sp.className = "scorepill"; sp.textContent = r.score.toFixed(0);
    td7.appendChild(sp);
    const pv = state.prev ? state.prev.get(r.id) : null;
    if (pv) {
      const ds = r.score - pv.score;
      if (Math.abs(ds) >= 1) {
        const m = document.createElement("span"); m.className = "mv " + (ds > 0 ? "up" : "dn");
        m.textContent = (ds > 0 ? "▲" : "▼") + Math.abs(ds).toFixed(0) + " today";
        td7.appendChild(m);
      }
    }
    tr.append(td0, td1, td2, td3, td4, td5, td6, td7);
    const toggle = () => { state.open.has(r.id) ? state.open.delete(r.id) : state.open.add(r.id); render(); };
    tr.addEventListener("click", toggle);
    tr.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
    tb.appendChild(tr);
    if (state.open.has(r.id)) tb.appendChild(detailRow(r));
  });
  if (!rows.length) {
    const tr = document.createElement("tr");
    const td = document.createElement("td"); td.colSpan = COLS.length; td.className = "l";
    td.textContent = "No games match the current filters.";
    tr.appendChild(td); tb.appendChild(tr);
  }
}
function detailRow(r) {
  const tr = document.createElement("tr"); tr.className = "detail";
  const td = document.createElement("td"); td.colSpan = COLS.length; td.className = "l";
  const t = document.createElement("table"); t.className = "tiers";
  const th = document.createElement("tr");
  for (const h of ["Prize", "Total", "Claimed", "Remaining", "% left"]) {
    const c = document.createElement("th"); c.textContent = h;
    if (h === "Prize") c.className = "l"; th.appendChild(c);
  }
  t.appendChild(th);
  const tiers = [...r.tiers].sort((a, b) => b[0] - a[0]);
  for (const [amt, tot, paid, rem, isTop] of tiers) {
    const rr = document.createElement("tr");
    const c0 = document.createElement("td"); c0.className = "l";
    c0.textContent = fmtMoney(amt) + (isTop ? " (top)" : "");
    if (isTop) c0.style.fontWeight = "650";
    const mk = v => { const c = document.createElement("td"); c.textContent = fmtInt(v); return c; };
    const c4 = document.createElement("td"); c4.textContent = tot ? (rem / tot * 100).toFixed(1) + "%" : "—";
    rr.append(c0, mk(tot), mk(paid), mk(rem), c4);
    t.appendChild(rr);
  }
  const est = document.createElement("div"); est.className = "dnote";
  est.textContent = "Est. " + fmtInt(Math.round(r.nRem)) + " tickets remaining · est. " + r.pctSold.toFixed(1) + "% sold";
  td.append(t, est); tr.appendChild(td);
  return tr;
}

function render() {
  const rows = sorted(filtered());
  renderHero(filtered());
  renderKpis(rows);
  renderBest(filtered());
  renderChart(filtered());
  renderTable(rows);
}

// ================= filters =================
function buildPriceChips() {
  const prices = [...new Set(state.rows.map(r => r.price))].sort((a, b) => a - b);
  const holder = $("priceChips"); holder.textContent = "";
  const mk = (label, val) => {
    const b = document.createElement("button");
    b.textContent = label;
    b.setAttribute("aria-pressed", String(state.price === val));
    b.addEventListener("click", () => { state.price = val; buildPriceChips(); render(); });
    holder.appendChild(b);
  };
  mk("All", "all");
  for (const p of prices) mk("$" + p, p);
}
$("viewChips").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.view = b.dataset.v; state.sortKey = null;
  for (const x of $("viewChips").children) x.setAttribute("aria-pressed", String(x === b));
  render();
});
$("search").addEventListener("input", e => { state.search = e.target.value; render(); });
$("themeBtn").addEventListener("click", () => {
  const cur = document.documentElement.dataset.theme || "dark";
  document.documentElement.dataset.theme = cur === "dark" ? "light" : "dark";
});
let rsTimer = null;
window.addEventListener("resize", () => { clearTimeout(rsTimer); rsTimer = setTimeout(render, 150); });

// ================= data loading =================
function applyData(raw, source) {
  const rows = computeRows(raw.G, raw.P);
  if (!rows.length) return false;
  state.rows = rows;
  state.asOf = raw.fetched;
  state.source = source;
  $("status").className = "status " + (source === "embedded" ? "snap" : "live");
  $("statusText").textContent = "Updated " + raw.fetched + (source === "live" ? " · live" : "");
  buildPriceChips(); render();
  return true;
}
async function loadSiteData() {
  try {
    const raw = await (await fetch(ST.data, { cache: "no-store" })).json();
    if (raw.fetched >= state.asOf) applyData(raw, "site");
  } catch (e) { /* not hosted or file:// — embedded snapshot stands */ }
  try {
    const prev = await (await fetch(ST.prev, { cache: "no-store" })).json();
    if (prev && prev.G) {
      const prows = computeRows(prev.G, prev.P);
      state.prev = new Map(prows.map(r => [r.id, { score: r.score, ev: r.ev }]));
      state.prevDate = prev.fetched;
      render();
    }
  } catch (e) { /* no previous day available */ }
}
async function liveRefresh() {
  const btn = $("refreshBtn"), st = $("statusText");
  btn.disabled = true;
  try {
    st.textContent = "Checking " + ST.lottery + "…";
    const raw = await ST.live((done, total) => { st.textContent = "Refreshing… " + done + "/" + total; });
    applyData(raw, "live");
  } catch (err) {
    $("statusText").textContent = "Updated " + state.asOf;
    $("status").className = "status " + (state.source === "embedded" ? "snap" : "live");
  } finally {
    btn.disabled = false;
  }
}
$("refreshBtn").addEventListener("click", liveRefresh);

// ================= boot =================
renderStaticCopy();
applyData(SNAPSHOT, "embedded");
loadSiteData().then(liveRefresh);
</script>
